<!DOCTYPE html>

<!-- EMAILJS -->

<style>
body {
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:#050505;
  color:#e6edf3;
}

header {
  position:relative;
  text-align:center;
  padding:100px 20px;
  background:url('https://raw.githubusercontent.com/Exeidlhzx/AlterEgo-Reborn/main/Untitled101_20260426231946.png') center/cover no-repeat;
}
header::after {
  content:'';
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.7);
}

.content { position:relative; z-index:2; }

.logo {
  width:120px;
  filter:drop-shadow(0 0 10px #00ff88);
}

h1 { color:#ff3c3c; }
.subtitle { color:#00ff88; }

.ip-box {
  margin-top:10px;
  display:inline-block;
  padding:12px 20px;
  border-radius:8px;
  border:1px solid #00ff88;
  background:#000;
}

button {
  margin-top:10px;
  padding:10px 18px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  background:linear-gradient(45deg,#ff0000,#00ff88);
}

section {
  padding:50px 20px;
  max-width:1000px;
  margin:auto;
}

.card {
  background:#0d1117;
  padding:20px;
  border-radius:10px;
  margin-top:15px;
}

.rank-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
}

.rank {
  background:#11161f;
  padding:20px;
  border-radius:10px;
  text-align:center;
}

.modal {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-box {
  background:#0d1117;
  padding:20px;
  border-radius:10px;
  width:300px;
  text-align:center;
}

.modal input {
  width:90%;
  padding:10px;
  margin-top:10px;
}

.discord-btn, .donate-btn {
  display:inline-block;
  margin-top:10px;
  padding:12px 20px;
  border-radius:8px;
  text-decoration:none;
  color:white;
}

.discord-btn { background:#5865F2; }
.donate-btn { background:#ff4d6d; }

.warning {
  margin-top:15px;
  color:#ffcc00;
  font-size:0.9em;
}
</style>
</head>

<body>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-box">
    <h3>Beli Rank</h3>
    <input id="user" placeholder="Minecraft Username">
    <input id="pass" type="password" placeholder="Kode Verifikasi">
    <br>
    <button onclick="submitOrder()">Submit</button>
    <button onclick="closeModal()">Close</button>
    <p id="msg"></p>
  </div>
</div>

<header>
<div class="content">
<img class="logo" src="https://raw.githubusercontent.com/Exeidlhzx/AlterEgo-Reborn/main/Untitled68_20260215202445.png">
<h1>AlterEgo Reborn</h1>
<div class="subtitle">Private • Survival • PvP • Vanilla</div>

<div class="ip-box" id="ip">*** LOCKED ***</div><br>
<button onclick="unlockIP()">Unlock IP</button>
</div>
</header>

<section>
<h2>👑 Rank Shop</h2>
<div class="card">
<div class="rank-grid">

<div class="rank">
<h3>VIP</h3>
<button onclick="buy('VIP')">Buy</button>
</div>

<div class="rank">
<h3>ELITE</h3>
<button onclick="buy('ELITE')">Buy</button>
</div>

<div class="rank">
<h3>LEGEND</h3>
<button onclick="buy('LEGEND')">Buy</button>
</div>

</div>
</div>
</section>

<section>
<h2>💖 Donasi</h2>
<div class="card">
<a class="donate-btn" href="https://trakteer.id/indra456" target="_blank">Trakteer</a>
<a class="donate-btn" href="https://saweria.co/XnotFound" target="_blank">Saweria</a>

<div class="warning">⚠️ Disarankan mematikan VPN agar tidak terjadi masalah koneksi</div>
</div>
</section>

<section>
<h2>🌐 Komunitas</h2>
<div class="card">
<a class="discord-btn" href="https://discord.gg/9fXW4FDpv" target="_blank">Join Discord</a>
</div>
</section>

<script>
const PASSWORD = "alter123";
let selected = "";

/* IP LOCK */
function unlockIP(){
  const p = prompt("Password:");
  if(p === PASSWORD){
    document.getElementById("ip").innerText = "play.AlterEgo.id";
  } else {
    alert("Salah!");
  }
}

/* OPEN MODAL */
function buy(rank){
  selected = rank;
  document.getElementById("modal").style.display = "flex";
}

function closeModal(){
  document.getElementById("modal").style.display = "none";
}

/* EMAILJS AUTO SEND */
function submitOrder(){
  const user = document.getElementById("user").value;
  const pass = document.getElementById("pass").value;

  if(!user || !pass){
    document.getElementById("msg").innerText = "Isi semua!";
    return;
  }

  emailjs.send("service_i97769i","template_eq7f1r7",{
    rank: selected,
    username: user,
    password: pass
  })
  .then(() => {
    document.getElementById("msg").innerText = "Berhasil dikirim!";
  })
  .catch(() => {
    document.getElementById("msg").innerText = "Gagal kirim!";
  });
}
</script>

</body>
</html>
