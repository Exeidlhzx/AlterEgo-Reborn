<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlterEgo Reborn</title>

<!-- EMAILJS V4 -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>
body {
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:#050505;
  color:#fff;
  text-align:center;
}

header {
  padding:80px 20px;
  background:url('https://raw.githubusercontent.com/Exeidlhzx/AlterEgo-Reborn/main/Untitled101_20260426231946.png') center/cover no-repeat;
}

.logo {
  width:120px;
}

button {
  margin-top:10px;
  padding:10px 20px;
  border:none;
  border-radius:6px;
  background:linear-gradient(45deg,#ff0000,#00ff88);
  cursor:pointer;
}

.card {
  margin:30px auto;
  max-width:400px;
  background:#111;
  padding:20px;
  border-radius:10px;
}

input {
  width:90%;
  padding:10px;
  margin-top:10px;
}

</style>
</head>

<body>

<header>
<img class="logo" src="https://raw.githubusercontent.com/Exeidlhzx/AlterEgo-Reborn/main/Untitled68_20260215202445.png">
<h1>AlterEgo Reborn</h1>
<p>Private Server</p>
</header>

<div class="card">
<h2>🛒 Beli Rank</h2>

<input id="username" placeholder="Minecraft Username">
<input id="kontak" placeholder="Discord / WA">

<br>
<button onclick="kirim()">Kirim Order</button>

<p id="status"></p>
</div>

<script>
/* INIT EMAILJS */
emailjs.init("r4Px8wBYxZT8-HkVl");

/* FUNCTION KIRIM (INI DOANG YANG PENTING) */
function kirim(){

  const username = document.getElementById("username").value;
  const kontak = document.getElementById("kontak").value;

  if(!username || !kontak){
    document.getElementById("status").innerText = "Isi semua dulu!";
    return;
  }

  emailjs.send("service_i97769i","template_eq7f1r7",{
    name: username,
    message: "Order Rank | Kontak: " + kontak
  })
  .then(() => {
    document.getElementById("status").innerText = "✅ BERHASIL DIKIRIM!";
  })
  .catch((err) => {
    console.log(err);
    document.getElementById("status").innerText = "❌ GAGAL KIRIM!";
  });

}
</script>

</body>
</html>
